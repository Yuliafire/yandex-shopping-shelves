<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Market</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="wrapper">
            <div class="shelf">
                <img src="./images/shelves.png" alt="shelf" draggable="false">
            </div>

            <div class="shelf-one">
                <img src="./images/wine.png" alt="wine" class="product wine" draggable="true">
                <img src="./images/milk.png" alt="milk" class="product milk" draggable="true">
                <img src="./images/honey.png" alt="honey" class="product honey" draggable="true">
                <img src="./images/cheese.png" alt="cheese" class="product cheese" draggable="true">
            </div>

            <div class="shelf-two">
                <img src="./images/beef.png" alt="beef" class="product beef" draggable="true">
                <img src="./images/chicken.png" alt="chicken" class="product chicken" draggable="true">
                <img src="./images/chips.png" alt="chips" class="product chips" draggable="true">
            </div>

            <div class="shelf-three">
                <img class="product pineapple" src="./images/pineapple.png" alt="pineapple" draggable="true">
                <img class="product banana" src="./images/banana.png" alt="banana" draggable="true">
                <img class="product apple" src="./images/apple.png" alt="apple" draggable="true">
                <img class="product salad" src="./images/salad.png" alt="salad" draggable="true">
            </div>

            <!-- different states of a basket -->
            <div class="basket-firstState"></div>
            <div class="basket-secondState"></div>
            <div class="basket-thirdState"></div>

            <div class="basket">
                <img src="./images/basket.png" alt="basket" draggable="false">
            </div>
        </div>

        <div class="btn-pay">
            Оплатить корзину
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
