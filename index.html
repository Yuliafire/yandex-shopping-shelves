<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yandex test</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <section class="container">
        <div class="wrapper">
            <div class="shelves">
                <img class="shelves-img" src="./images/shelves.png" alt="shelves" draggable="false">
            </div>
            <div class="shelf-one">
                <img class="item wine" src="./images/wine.png" alt="wine" draggable="true">
                <img class="item milk" src="./images/milk.png" alt="milk" draggable="true">
                <img class="item honey" src="./images/honey.png" alt="honey" draggable="true">
                <img class="item cheese" src="./images/cheese.png" alt="cheese" draggable="true">
            </div>

            <div class="shelf-two">
                <img class="item chicken" src="./images/chicken.png" alt="wine" draggable="true">
                <img class="item beef" src="./images/beef.png" alt="milk" draggable="true">
                <img class="item chips" src="./images/chips.png" alt="honey" draggable="true">
            </div>

            <div class="shelf-three">
                <img class="item pineapple" src="./images/pineapple.png" alt="pineapple" draggable="true">
                <img class="item banana" src="./images/banana.png" alt="banana" draggable="true">
                <img class="item aple" src="./images/apple.png" alt="aple" draggable="true">
                <img class="item salad" src="./images/salad.png" alt="salad" draggable="true">
            </div>

            <div class="basket-firstState"></div>
            <div class="basket-secondState"></div>
            <div class="basket-thirdState"></div>

            <div class="basket">
                <img src="./images/basket.png" alt="basket">
            </div>
        </div>

        <button class="button-pay">Оплатить корзину</button>
    </section>

    <script src="./script.js"></script>
</body>

</html>
