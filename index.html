<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yandex test</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="container">

    <div class="wrapper">
      <div class="shelf">
        <img src="./images/shelves.png" alt="shelf" draggable="false">
      </div>
      <div class="shelf-one">
        <img class="product wine" src="./images/wine.png" alt="wine" draggable="true">
        <img class="product milk" src="./images/milk.png" alt="milk" draggable="true">
        <img class="product honey" src="./images/honey.png" alt="honey" draggable="true">
        <img class="product cheese" src="./images/cheese.png" alt="cheese" draggable="true">
      </div>

      <div class="shelf-two">
        <img class="product beef" src="./images/beef.png" alt="beef" draggable="true">
        <img class="product chicken" src="./images/chicken.png" alt="chicken" draggable="true">
        <img class="product chips" src="./images/chips.png" alt="chips" draggable="true">
      </div>

      <div class="shelf-three">
        <img class="product pineapple" src="./images/pineapple.png" alt="pineapple" draggable="true">
        <img class="product banana" src="./images/banana.png" alt="banana" draggable="true">
        <img class="product apple" src="./images/apple.png" alt="apple" draggable="true">
        <img class="product salad" src="./images/salad.png" alt="salad" draggable="true">

      </div>

      <div class="basket-firstState"></div>
      <div class="basket-secondState"></div>
      <div class="basket-thirdState"></div>


      <div class="basket">
        <img src="./images/basket.png" alt="basket">
      </div>
    </div>

    <button class="btn-pay">
      Оплатить корзину
    </button>
  </div>

  <script src="./script.js"></script>
</body>

</html>
